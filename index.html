<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GenCount — generate usernames, emails and strong passwords, and count characters, words and sentences in real time."
    />
    <title>GenCount — Username, Password &amp; Text Tools</title>
    <link rel="icon" href="https://fav.farm/🛠️" />

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />

    <style>
      :root {
        --gc-radius: 14px;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      /* ---------- Cards ---------- */
      .gc-card {
        border: 1px solid var(--bs-border-color);
        border-radius: var(--gc-radius);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        background-color: var(--bs-body-bg);
        transition: background-color 0.25s ease, border-color 0.25s ease;
      }

      [data-bs-theme="dark"] .gc-card {
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      /* ---------- Result boxes ---------- */
      .result-box {
        background-color: var(--bs-tertiary-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 10px;
        min-height: 56px;
        padding: 0.75rem 0.85rem;
      }

      .result-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
          monospace;
        font-size: 1rem;
        line-height: 1.4;
        word-break: break-all;
        overflow-wrap: anywhere;
      }

      @media (min-width: 768px) {
        .result-text {
          font-size: 1.05rem;
        }
      }

      .icon-btn {
        --bs-btn-padding-x: 0.4rem;
        --bs-btn-padding-y: 0.2rem;
        border-radius: 8px;
        line-height: 1;
      }

      /* ---------- Stat cards ---------- */
      .stat-card {
        background-color: var(--bs-tertiary-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 10px;
        text-align: center;
        padding: 0.65rem 0.35rem;
        height: 100%;
      }

      .stat-number {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--bs-primary);
        line-height: 1.2;
      }

      @media (min-width: 576px) {
        .stat-number {
          font-size: 1.5rem;
        }
      }

      .stat-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--bs-secondary-color);
        margin-top: 0.15rem;
      }

      /* ---------- Section titles ---------- */
      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
      }

      /* ---------- Strength meter ---------- */
      .strength-track {
        height: 6px;
        border-radius: 999px;
        background-color: var(--bs-tertiary-bg);
        overflow: hidden;
      }

      .strength-bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        transition: width 0.3s ease, background-color 0.3s ease;
      }

      /* ---------- Misc ---------- */
      .form-label-xs {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--bs-secondary-color);
        margin-bottom: 0.25rem;
      }

      textarea#textInput {
        min-height: 190px;
        resize: vertical;
        border-radius: 10px;
      }

      .navbar-brand {
        letter-spacing: 0.2px;
      }

      .swal2-popup.gc-toast {
        border-radius: 10px;
        font-size: 0.95rem;
      }
    </style>
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
          <i class="bi bi-shield-lock-fill me-2"></i>GenCount
        </a>

        <div class="form-check form-switch text-light mb-0">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="themeToggle"
            aria-label="Toggle dark mode"
          />
          <label class="form-check-label small" for="themeToggle" id="themeLabel">
            <i class="bi bi-sun-fill me-1"></i>Light
          </label>
        </div>
      </div>
    </nav>

    <!-- ================= MAIN ================= -->
    <main class="container pb-5">
      <div class="row g-4">
        <!-- ============ LEFT COLUMN ============ -->
        <div class="col-12 col-lg-6">
          <!-- ---------- Username Generator ---------- -->

            <h2 class="section-title text-primary mb-3">
              <i class="bi bi-person-badge me-2"></i>Username Generator

              <span id="generatedUsername" class="result-text flex-grow-1"

              >

                </button>

            </div>

            <div class="mb-3">

              <div class="col-6">

            <!-- Catch-all options -->

              <label class="form-label form-label-xs" for="catchDomain"

          </section>

          <!-- ---------- Password Generator ---------- -->
          <section class="gc-card p-3 p-md-4">
            <h2 class="section-title text-primary mb-3">
              <i class="bi bi-key-fill me-2"></i>Password Generator
            </h2>

            <div

            >
              <span id="generatedPassword" class="result-text flex-grow-1"

            </div>

            <!-- Strength meter -->
            <div class="d-flex align-items-center gap-2 mb-3">
              <div class="strength-track flex-grow-1">
                <div id="strengthBar" class="strength-bar"></div>
              </div>
              <small

            </div>

            <!-- Mode switch -->
            <div

              role="radiogroup"
              aria-label="Password mode"
            >
              <div class="form-check mb-0">
                <input
                  class="form-check-input"
                  type="radio"
                  name="passMode"
                  id="modePassword"
                  checked
                />
                <label class="form-check-label small fw-semibold" for="modePassword"
                  >Random Password</label
                >
              </div>
              <div class="form-check mb-0">
                <input
                  class="form-check-input"
                  type="radio"
                  name="passMode"
                  id="modePassphrase"
                />
                <label class="form-check-label small" for="modePassphrase"
                  >Memorable Passphrase</label
                >
              </div>
            </div>

            <!-- Password options -->
            <div id="passOptionsContainer" class="row g-2">
              <div class="col-12 col-md-7">
                <label class="form-label form-label-xs" for="passLengthSlider"
                  >Length (<span id="lenVal">16</span>)</label
                >
                <input
                  type="range"
                  id="passLengthSlider"
                  class="form-range"
                  min="5"
                  max="128"
                  value="16"
                />
              </div>

              <div class="col-12 col-md-5 d-flex align-items-center">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="avoidAmbiguous"
                  />
                  <label class="form-check-label small" for="avoidAmbiguous"
                    >Avoid ambiguous characters</label
                  >
                </div>
              </div>

              <div class="col-6 col-md-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="incUpper"
                    checked
                  />
                  <label class="form-check-label small" for="incUpper">A–Z</label>
                </div>
              </div>

              <div class="col-6 col-md-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="incLower"
                    checked
                  />
                  <label class="form-check-label small" for="incLower">a–z</label>
                </div>
              </div>

              <div class="col-6 col-md-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="incNum"
                    checked
                  />
                  <label class="form-check-label small" for="incNum">0–9</label>
                </div>
              </div>

              <div class="col-6 col-md-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="incSpec" />
                  <label class="form-check-label small" for="incSpec"
                    >!@#$%^&amp;*</label
                  >
                </div>
              </div>
            </div>

            <!-- Passphrase options -->
            <div id="phraseOptionsContainer" class="d-none row g-2">
              <div class="col-12 col-md-6">
                <label class="form-label form-label-xs" for="phraseWordsSlider"
                  >Number of words (<span id="phraseWordsVal">4</span>)</label
                >
                <input
                  type="range"
                  id="phraseWordsSlider"
                  class="form-range"
                  min="3"
                  max="12"
                  value="4"
                />
              </div>

              <div class="col-6 col-md-3">
                <label class="form-label form-label-xs" for="phraseSeparator"
                  >Separator</label
                >
                <input
                  type="text"
                  id="phraseSeparator"
                  class="form-control form-control-sm"
                  value="-"
                  maxlength="3"
                  autocomplete="off"
                />
              </div>

              <div class="col-6 col-md-3 d-flex align-items-end">
                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="phraseCapitalize"
                    checked
                  />
                  <label class="form-check-label small" for="phraseCapitalize"
                    >Capitalize</label
                  >
                </div>
              </div>
            </div>
          </section>
        </div>

        <!-- ============ RIGHT COLUMN ============ -->
        <div class="col-12 col-lg-6">
          <section class="gc-card p-3 p-md-4 h-100 d-flex flex-column">
            <h2 class="section-title text-success mb-3">
              <i class="bi bi-file-earmark-text-fill me-2"></i>Character &amp;
              Text Counter
            </h2>

            <textarea
              id="textInput"
              class="form-control flex-grow-1 mb-3"
              placeholder="Type or paste your text here to analyze it…"
              spellcheck="false"
            ></textarea>

            <div class="row g-2 mb-2">
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <div class="stat-number" id="charCount">0</div>
                  <div class="stat-label">Characters</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <div class="stat-number" id="charNoSpaces">0</div>
                  <div class="stat-label">No Spaces</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <div class="stat-number" id="wordCount">0</div>
                  <div class="stat-label">Words</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <div class="stat-number" id="sentenceCount">0</div>
                  <div class="stat-label">Sentences</div>
                </div>
              </div>
            </div>

            <div class="row g-2">
              <div class="col-6 col-sm-4">
                <div class="stat-card">
                  <div class="stat-number" id="lineCount">0</div>
                  <div class="stat-label">Lines</div>
                </div>
              </div>
              <div class="col-6 col-sm-4">
                <div class="stat-card">
                  <div class="stat-number" id="paragraphCount">0</div>
                  <div class="stat-label">Paragraphs</div>
                </div>
              </div>
              <div class="col-12 col-sm-4">
                <div class="stat-card">
                  <div class="stat-number" id="readingTime">0s</div>
                  <div class="stat-label">Reading Time</div>
                </div>
              </div>
            </div>

            <div
              class="mt-3 d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-2"
            >
              <small class="text-secondary">
                <i class="bi bi-info-circle me-1"></i>Reading speed: 200 wpm
              </small>
              <button
                id="clearTextBtn"
                class="btn btn-outline-danger btn-sm"
                type="button"
              >
                <i class="bi bi-trash3 me-1"></i>Clear Text
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="container pb-4">
      <p class="text-center text-secondary small mb-0">
        GenCount — everything runs locally in your browser. No data is sent
        anywhere.
      </p>
    </footer>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      (function () {
        "use strict";

        /* =========================================================
           0. WORD LIST (offline — no external API required)
           ========================================================= */
        const WORD_LIST = [
          "apple","anchor","arrow","atlas","amber","angel","april","arch","arena","aurora",
          "bacon","badge","baker","bamboo","banjo","barrel","basil","beacon","beetle","berry",
          "bishop","blanket","blossom","bottle","boulder","branch","brave","bread","breeze","bridge",
          "bright","bronze","brook","bubble","bucket","buffalo","button","cabin","cactus","candle",
          "canyon","captain","carrot","castle","cedar","celery","chalk","cherry","chess","chicken",
          "cider","cinema","circle","citrus","clever","cliff","clover","cobalt","coconut","coffee",
          "comet","copper","coral","cosmos","cotton","cougar","coyote","crimson","crystal","cupcake",
          "daisy","dancer","dandelion","dawn","delta","denim","desert","diamond","dolphin","donkey",
          "dragon","dream","drift","eagle","earth","ember","emerald","engine","falcon","feather",
          "fiddle","firefly","fjord","flame","flint","flower","forest","fossil","fountain","fox",
          "galaxy","garden","garnet","gentle","ginger","glacier","globe","golden","granite","grape",
          "gravity","guitar","hammer","harbor","harvest","hazel","helmet","heron","honey","horizon",
          "hunter","igloo","indigo","island","ivory","jade","jaguar","jasmine","jigsaw","jungle",
          "jupiter","kayak","kernel","kettle","keyboard","kingdom","kitten","koala","lagoon","lantern",
          "lark","laser","lavender","lemon","leopard","library","lilac","lily","linen","lion",
          "lizard","lobster","lotus","lunar","magnet","mango","maple","marble","marine","meadow",
          "melon","meteor","midnight","mirror","misty","monarch","moon","mountain","muffin","mustard",
          "nebula","nectar","needle","nickel","nimble","noble","noodle","north","nutmeg","oasis",
          "ocean","olive","onion","opal","orbit","orchid","otter","owl","oyster","panda",
          "panther","papaya","parrot","pebble","pelican","penguin","pepper","petal","phoenix","piano",
          "pigment","pillow","pilot","pinecone","planet","plasma","plum","pocket","polar","poncho",
          "poppy","prairie","prism","pumpkin","puzzle","python","quartz","quill","rabbit","radar",
          "rainbow","raven","reef","river","robin","rocket","rose","ruby","safari","saffron",
          "sage","salmon","sapphire","scarlet","shadow","shark","shelter","sherbet","silver","sketch",
          "sky","slate","sleet","sliver","snow","socket","solar","sonnet","spark","sparrow",
          "spider","spiral","spring","sprout","squash","starlight","statue","steam","stellar","stone",
          "storm","strawberry","summit","sunset","surfer","swamp","swift","syrup","taffy","talon",
          "tango","teal","temple","thunder","tiger","timber","toffee","topaz","tornado","tortoise",
          "tower","trail","tulip","tundra","turtle","twilight","umber","unicorn","valley","vanilla",
          "velvet","venture","vertex","violet","violin","vision","volcano","voyage","waffle","walnut",
          "wave","willow","window","winter","wizard","wolf","wonder","yarrow","yellow","zebra",
          "zenith","zephyr","zigzag"
        ];

        /* =========================================================
           1. SECURE RANDOM HELPERS
           ========================================================= */
        const cryptoObj = window.crypto || window.msCrypto;

        /** Uniform random integer in [0, max) using rejection sampling. */
        function randomInt(max) {
          if (max <= 0) return 0;
          if (cryptoObj && cryptoObj.getRandomValues) {
            const limit = Math.floor(0xffffffff / max) * max;
            const buf = new Uint32Array(1);
            let value;
            do {
              cryptoObj.getRandomValues(buf);
              value = buf[0];
            } while (value >= limit);
            return value % max;
          }
          return Math.floor(Math.random() * max);
        }

        function pickRandom(str) {
          return str.charAt(randomInt(str.length));
        }

        function shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = randomInt(i + 1);
            const tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
          }
          return arr;
        }

        function randomWord() {
          return WORD_LIST[randomInt(WORD_LIST.length)];
        }

        function capitalize(word) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        }

        function randomDigits(count) {
          let out = "";
          for (let i = 0; i < count; i++) out += randomInt(10);
          return out;
        }

        function randomToken(length) {
          const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
          let out = "";
          for (let i = 0; i < length; i++) out += pickRandom(chars);
          return out;
        }

        /* =========================================================
           2. TOAST NOTIFICATIONS
           ========================================================= */
        const Toast = Swal.mixin({
          toast: true,
          position: "top",
          showConfirmButton: false,
          timer: 2200,
          timerProgressBar: true,
          customClass: { popup: "gc-toast" }
        });

        function isDark() {
          return document.documentElement.getAttribute("data-bs-theme") === "dark";
        }

        function toast(icon, title) {
          Toast.fire({
            icon: icon,
            title: title,
            background: isDark() ? "#212529" : "#ffffff",
            color: isDark() ? "#f8f9fa" : "#212529"
          });
        }

        /* =========================================================
           3. CLIPBOARD (with fallback for non-secure contexts)
           ========================================================= */
        async function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            try {
              await navigator.clipboard.writeText(text);
              return true;
            } catch (err) {
              /* fall through to legacy method */
            }
          }
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "-1000px";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, ta.value.length);
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
          } catch (err) {
            return false;
          }
        }

        /* =========================================================
           4. THEME HANDLING
           ========================================================= */
        const themeToggle = document.getElementById("themeToggle");
        const themeLabel = document.getElementById("themeLabel");
        const THEME_KEY = "gencount-theme";

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-bs-theme", theme);
          const dark = theme === "dark";
          themeToggle.checked = dark;
          themeLabel.innerHTML = dark
            ? '<i class="bi bi-moon-stars-fill me-1"></i>Dark'
            : '<i class="bi bi-sun-fill me-1"></i>Light';
        }

        function initTheme() {
          let saved = null;
          try {
            saved = localStorage.getItem(THEME_KEY);
          } catch (e) {
            saved = null;
          }
          if (saved === "dark" || saved === "light") {
            applyTheme(saved);
          } else {
            const prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(prefersDark ? "dark" : "light");
          }
        }

        themeToggle.addEventListener("change", function () {
          const theme = themeToggle.checked ? "dark" : "light";
          applyTheme(theme);
          try {
            localStorage.setItem(THEME_KEY, theme);
          } catch (e) {
            /* ignore storage errors */
          }
        });

        /* =========================================================
           5. USERNAME GENERATOR
           ========================================================= */
        const uType = document.getElementById("usernameType");
        const genUsername = document.getElementById("generatedUsername");
        const wordOptions = document.getElementById("wordOptions");
        const emailOptions = document.getElementById("emailOptions");
        const catchAllOptions = document.getElementById("catchAllOptions");

        function generateUsername() {
          const type = uType.value;

          if (type === "random_word") {
            let word = randomWord();
            if (document.getElementById("userCapitalize").checked) {
              word = capitalize(word);
            }
            if (document.getElementById("userIncludeNum").checked) {
              word += randomDigits(2 + randomInt(2)); // 2–3 digits
            }
            genUsername.textContent = word;
          } else if (type === "plus_email") {
            const base =
              document.getElementById("baseEmail").value.trim() ||
              "user@gmail.com";
            const at = base.lastIndexOf("@");
            const local = at > 0 ? base.slice(0, at) : "user";
            const domain = at > 0 ? base.slice(at + 1) : "gmail.com";
            genUsername.textContent =
              local + "+" + randomToken(6) + "@" + domain;
          } else {
            const domain =
              document.getElementById("catchDomain").value.trim() ||
              "mydomain.com";
            genUsername.textContent = randomToken(8) + "@" + domain;
          }
        }

        function updateUsernameVisibility() {
          const type = uType.value;
          wordOptions.classList.toggle("d-none", type !== "random_word");
          emailOptions.classList.toggle("d-none", type !== "plus_email");
          catchAllOptions.classList.toggle("d-none", type !== "catch_all");
        }

        uType.addEventListener("change", function () {
          updateUsernameVisibility();
          generateUsername();
        });

        ["userCapitalize", "userIncludeNum"].forEach(function (id) {
          document.getElementById(id).addEventListener("change", generateUsername);
        });

        ["baseEmail", "catchDomain"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", generateUsername);
        });

        document
          .getElementById("regenUsernameBtn")
          .addEventListener("click", generateUsername);

        document
          .getElementById("copyUsernameBtn")
          .addEventListener("click", async function () {
            const value = genUsername.textContent.trim();
            if (!value || value === "—") {
              toast("error", "Nothing to copy yet!");
              return;
            }
            const ok = await copyText(value);
            toast(
              ok ? "success" : "error",
              ok ? "Username copied!" : "Copy failed — please copy manually."
            );
          });

        /* =========================================================
           6. PASSWORD GENERATOR
           ========================================================= */
        const genPassword = document.getElementById("generatedPassword");
        const modePassword = document.getElementById("modePassword");
        const modePassphrase = document.getElementById("modePassphrase");
        const passOptionsContainer = document.getElementById("passOptionsContainer");
        const phraseOptionsContainer = document.getElementById("phraseOptionsContainer");
        const passLengthSlider = document.getElementById("passLengthSlider");
        const lenVal = document.getElementById("lenVal");
        const phraseWordsSlider = document.getElementById("phraseWordsSlider");
        const phraseWordsVal = document.getElementById("phraseWordsVal");
        const avoidAmbiguous = document.getElementById("avoidAmbiguous");
        const incUpper = document.getElementById("incUpper");
        const incLower = document.getElementById("incLower");
        const incNum = document.getElementById("incNum");
        const incSpec = document.getElementById("incSpec");
        const phraseSeparator = document.getElementById("phraseSeparator");
        const phraseCapitalize = document.getElementById("phraseCapitalize");
        const strengthBar = document.getElementById("strengthBar");
        const strengthLabel = document.getElementById("strengthLabel");

        const SETS = {
          upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          lower: "abcdefghijklmnopqrstuvwxyz",
          numbers: "0123456789",
          specials: "!@#$%^&*()_+-=[]{}|;:,.<>?"
        };

        /** Build a password guaranteeing ≥1 char from each selected set. */
        function buildPassword(length, sets) {
          const pool = sets.join("");
          const chars = [];

          const guaranteed = sets.slice(0, Math.min(sets.length, length));
          for (let i = 0; i < guaranteed.length; i++) {
            chars.push(pickRandom(guaranteed[i]));
          }
          while (chars.length < length) {
            chars.push(pickRandom(pool));
          }
          return shuffle(chars).join("");
        }

        function updateStrength(bits) {
          let pct, color, label;

          if (bits < 40) {
            pct = Math.max(8, (bits / 40) * 30);
            color = "var(--bs-danger)";
            label = "Weak";
          } else if (bits < 60) {
            pct = 45;
            color = "var(--bs-warning)";
            label = "Fair";
          } else if (bits < 80) {
            pct = 70;
            color = "var(--bs-info)";
            label = "Good";
          } else {
            pct = Math.min(100, 80 + ((bits - 80) / 48) * 20);
            color = "var(--bs-success)";
            label = "Strong";
          }

          strengthBar.style.width = pct + "%";
          strengthBar.style.backgroundColor = color;
          strengthLabel.textContent =
            label + " · ~" + Math.round(bits) + " bits";
          strengthLabel.style.color = color;
        }

        function generatePassword() {
          if (modePassword.checked) {
            const length = parseInt(passLengthSlider.value, 10) || 16;

            let upper = SETS.upper;
            let lower = SETS.lower;
            let numbers = SETS.numbers;
            const specials = SETS.specials;

            if (avoidAmbiguous.checked) {
              upper = upper.replace(/[OI]/g, "");
              lower = lower.replace(/[lo]/g, "");
              numbers = numbers.replace(/[01]/g, "");
            }

            const sets = [];
            if (incUpper.checked && upper) sets.push(upper);
            if (incLower.checked && lower) sets.push(lower);
            if (incNum.checked && numbers) sets.push(numbers);
            if (incSpec.checked) sets.push(specials);

            if (sets.length === 0) {
              genPassword.textContent = "⚠ Select at least one character set";
              strengthBar.style.width = "0%";
              strengthLabel.textContent = "—";
              strengthLabel.style.color = "";
              return;
            }

            genPassword.textContent = buildPassword(length, sets);

            const poolSize = sets.join("").length;
            updateStrength(length * Math.log2(poolSize));
          } else {
            const wordCount = parseInt(phraseWordsSlider.value, 10) || 4;
            const separator = phraseSeparator.value;

            const words = [];
            for (let i = 0; i < wordCount; i++) {
              let w = randomWord();
              if (phraseCapitalize.checked) w = capitalize(w);
              words.push(w);
            }

            genPassword.textContent = words.join(separator);

            const bitsPerWord = Math.log2(WORD_LIST.length);
            updateStrength(wordCount * bitsPerWord + (wordCount - 1) * 1.5);
          }
        }

        function togglePasswordMode() {
          const isPassword = modePassword.checked;
          passOptionsContainer.classList.toggle("d-none", !isPassword);
          phraseOptionsContainer.classList.toggle("d-none", isPassword);
          generatePassword();
        }

        modePassword.addEventListener("change", togglePasswordMode);
        modePassphrase.addEventListener("change", togglePasswordMode);

        passLengthSlider.addEventListener("input", function () {
          lenVal.textContent = passLengthSlider.value;
          generatePassword();
        });

        phraseWordsSlider.addEventListener("input", function () {
          phraseWordsVal.textContent = phraseWordsSlider.value;
          generatePassword();
        });

        [
          avoidAmbiguous,
          incUpper,
          incLower,
          incNum,
          incSpec,
          phraseCapitalize
        ].forEach(function (el) {
          el.addEventListener("change", generatePassword);
        });

        phraseSeparator.addEventListener("input", generatePassword);

        document
          .getElementById("regenPasswordBtn")
          .addEventListener("click", generatePassword);

        document
          .getElementById("copyPasswordBtn")
          .addEventListener("click", async function () {
            const value = genPassword.textContent.trim();
            if (!value || value === "—" || value.startsWith("⚠")) {
              toast("error", "Nothing to copy yet!");
              return;
            }
            const ok = await copyText(value);
            toast(
              ok ? "success" : "error",
              ok ? "Password copied!" : "Copy failed — please copy manually."
            );
          });

        /* =========================================================
           7. TEXT / CHARACTER COUNTER
           ========================================================= */
        const textInput = document.getElementById("textInput");
        const charCountEl = document.getElementById("charCount");
        const charNoSpacesEl = document.getElementById("charNoSpaces");
        const wordCountEl = document.getElementById("wordCount");
        const sentenceCountEl = document.getElementById("sentenceCount");
        const lineCountEl = document.getElementById("lineCount");
        const paragraphCountEl = document.getElementById("paragraphCount");
        const readingTimeEl = document.getElementById("readingTime");

        const WORDS_PER_MINUTE = 200;

        function formatReadingTime(seconds) {
          if (seconds < 60) return seconds + "s";
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return m + "m " + s + "s";
        }

        function updateTextStats() {
          const text = textInput.value;

          // Characters
          charCountEl.textContent = text.length;
          charNoSpacesEl.textContent = text.replace(/\s/g, "").length;

          // Words
          const trimmed = text.trim();
          const words = trimmed ? trimmed.split(/\s+/).filter(Boolean) : [];
          wordCountEl.textContent = words.length;

          // Sentences
          const sentences = trimmed
            ? trimmed.split(/[.!?…]+/).filter(function (s) {
                return s.trim().length > 0;
              })
            : [];
          sentenceCountEl.textContent = sentences.length;

          // Lines
          lineCountEl.textContent = text.length ? text.split(/\r\n|\r|\n/).length : 0;

          // Paragraphs
          const paragraphs = trimmed
            ? trimmed.split(/\n\s*\n/).filter(function (p) {
                return p.trim().length > 0;
              })
            : [];
          paragraphCountEl.textContent = paragraphs.length;

          // Reading time
          const seconds = Math.round((words.length / WORDS_PER_MINUTE) * 60);
          readingTimeEl.textContent = formatReadingTime(seconds);
        }

        textInput.addEventListener("input", updateTextStats);

        document
          .getElementById("clearTextBtn")
          .addEventListener("click", function () {
            if (!textInput.value) return;
            textInput.value = "";
            updateTextStats();
            textInput.focus();
          });

        /* =========================================================
           8. INITIALISE
           ========================================================= */
        initTheme();
        updateUsernameVisibility();
        togglePasswordMode(); // sets correct panel + generates password
        generateUsername();
        updateTextStats();
      })();
    </script>
  </body>
</html>
